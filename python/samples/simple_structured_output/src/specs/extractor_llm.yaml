kind: LLMNode
name: extractor
prompts:
  system:
    en: |
      You are a book information extractor.
      Given question about a book, provide the info.
      Select any matches the request.
structured_output:
  # The main title of the book as it appears on the cover
  title: str
  # The full name of the primary author, including first and last name
  author: str
  # The year the book was first published;
  # use 0 when the year cannot be determined from the text
  year: int
  # The primary literary genre of the book,
  # for example Fantasy, Science Fiction, Mystery, or Romance
  genre: str
  # A list of the most important characters in the story,
  # by their names as they appear in the book
  main_characters: [str]
  info:
    # True if the book is known to have reached bestseller status in any major market
    bestseller: bool
    # Years of subsequent editions or new print runs after the original publication,
    # excluding the first one; omit if unknown
    publications?: [str]

# Extended format: each field is a descriptor with type, description, optional.
# Can be mixed with the simple format in the same structured_output block,
# e.g. some fields use "field: type" and others use the descriptor dict below.
